openapi: 3.0.3
info:
  title: TaskFlow API Documentation
  version: 1.0.0
  description: >
    Production-grade RESTful API specification for TaskFlow, a collaborative project management and workflow platform.
    Features JWT authentication, role-based access control (RBAC), multi-member project workspaces, task tracking with subtasks and file attachments, and note documentation.
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server

tags:
  - name: Health Check
    description: System operational health check endpoints
  - name: Authentication
    description: Account registration, session management, password recovery, and email verification
  - name: Users
    description: Authenticated user profile and account management
  - name: Projects
    description: Project workspace management and member access control
  - name: Tasks
    description: Task lifecycle management, subtasks, and file attachment handling
  - name: Notes
    description: Collaborative project documentation notes

paths:
  /healthcheck:
    get:
      tags:
        - Health Check
      summary: Check service health status
      description: >
        **Purpose**: Performs an operational health check on the API service to verify server status and database connectivity.<br>
        **Authorization**: Public (No authentication required).<br>
        **Side Effects**: None.<br>
        **Expected Behavior**: Returns HTTP status 200 with JSON payload `{ status: "OK" }`.
      operationId: getHealthStatus
      responses:
        "200":
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Health check successful
                data:
                  status: OK
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user account
      description: >
        **Purpose**: Registers a new user account in the TaskFlow system.<br>
        **Authorization**: Public (No authentication required).<br>
        **Side Effects**: Creates a new user record in MongoDB with hashed password, generates a temporary SHA-256 email verification token, and sends a verification email.<br>
        **Expected Behavior**: Returns HTTP 201 with the created user object omitting sensitive fields. Throws HTTP 409 if username or email already exists.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        "201":
          description: User account created successfully. Verification email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 201
                success: true
                message: User registered successfully. Please check your email to verify your account.
                data:
                  _id: 650c1f1e2f8b9a001c2d3e4f
                  username: alex_rivera
                  email: alex.rivera@taskflow.dev
                  fullName: Alex Rivera
                  isEmailVerified: false
                  avatar:
                    url: https://placehold.co/200?text=No+Image
                    localPath: ""
                  createdAt: "2026-01-15T08:30:00.000Z"
                  updatedAt: "2026-01-15T08:30:00.000Z"
        "400":
          $ref: '#/components/responses/ValidationError'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate user credentials
      description: >
        **Purpose**: Authenticates a user using email or username along with their password.<br>
        **Authorization**: Public (No authentication required).<br>
        **Side Effects**: Saves hashed refresh token to user document in database and sets HTTP-Only `refreshToken` cookie.<br>
        **Expected Behavior**: Returns HTTP 200 with User profile object, JWT Access Token, and Refresh Token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        "200":
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: User logged in successfully
                data:
                  user:
                    _id: 650c1f1e2f8b9a001c2d3e4f
                    username: alex_rivera
                    email: alex.rivera@taskflow.dev
                    fullName: Alex Rivera
                    isEmailVerified: true
                    avatar:
                      url: https://placehold.co/200?text=No+Image
                      localPath: ""
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2NTBjMWYxZTJmOGI5YTAwMWMyZDNlNGYiLCJ1c2VybmFtZSI6ImFsZXhfcml2ZXJhIiwiZW1haWwiOiJhbGV4LnJpdmVyYUB0YXNrZmxvdy5kZXYiLCJpYXQiOjE3Njg0NjYwMDAsImV4cCI6MTc2ODU1MjQwMH0.signature
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2NTBjMWYxZTJmOGI5YTAwMWMyZDNlNGYiLCJpYXQiOjE3Njg0NjYwMDAsImV4cCI6MTc2OTA3MDgwMH0.signature
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email/{verificationToken}:
    get:
      tags:
        - Authentication
      summary: Verify user email address
      description: >
        **Purpose**: Validates the email verification token sent via email and marks user account as verified.<br>
        **Authorization**: Public.<br>
        **Side Effects**: Sets `isEmailVerified: true` and clears `emailVerificationToken` and `emailVerificationTokenExpiry` on User document.<br>
        **Expected Behavior**: Returns HTTP 200 on successful verification. Throws HTTP 400 if token is invalid or expired.
      operationId: verifyEmail
      parameters:
        - name: verificationToken
          in: path
          required: true
          description: SHA-256 unhashed token received via verification email link
          schema:
            type: string
          example: 4a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b
      responses:
        "200":
          description: User email verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Email verified successfully
                data: {}
        "400":
          $ref: '#/components/responses/ValidationError'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens
      description: >
        **Purpose**: Issues a fresh JWT Access Token and Refresh Token pair using an active Refresh Token.<br>
        **Authorization**: Public (Accepts Refresh Token via cookie or request body).<br>
        **Side Effects**: Updates `refreshToken` field in MongoDB user document and resets cookie.<br>
        **Expected Behavior**: Returns HTTP 200 with new Access Token and Refresh Token.
      operationId: refreshAccessToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Optional explicit refresh token string if HTTP-only cookie is not present
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Access token refreshed successfully
                data:
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset email
      description: >
        **Purpose**: Initiates password recovery process for a registered user.<br>
        **Authorization**: Public.<br>
        **Side Effects**: Generates temporary SHA-256 reset token with 20-minute expiration and dispatches email with reset link.<br>
        **Expected Behavior**: Returns HTTP 200 acknowledging reset request. Throws 404 if email is not registered.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "200":
          description: Password reset email dispatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Password reset mail sent successfully
                data: {}
        "400":
          $ref: '#/components/responses/ValidationError'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password/{resetToken}:
    post:
      tags:
        - Authentication
      summary: Reset password using reset token
      description: >
        **Purpose**: Sets a new account password using a valid password reset token.<br>
        **Authorization**: Public.<br>
        **Side Effects**: Replaces existing hashed password, invalidates reset token, and clears token expiration.<br>
        **Expected Behavior**: Returns HTTP 200 on successful password update. Throws HTTP 400 if token is invalid, expired, or passwords do not match.
      operationId: resetPassword
      parameters:
        - name: resetToken
          in: path
          required: true
          description: Temporary password reset token from email link
          schema:
            type: string
          example: 9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Password reset successfully
                data: {}
        "400":
          $ref: '#/components/responses/ValidationError'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout current user
      description: >
        **Purpose**: Logs out the current user session.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: Removes `refreshToken` from user document in MongoDB and clears authentication cookies (`accessToken` and `refreshToken`).<br>
        **Expected Behavior**: Returns HTTP 200 confirming user logged out.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful and cookies cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: User logged out successfully
                data: {}
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/current-user:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: >
        **Purpose**: Fetches profile data of the currently authenticated user.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: None.<br>
        **Expected Behavior**: Returns HTTP 200 with User profile object.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Current user fetched successfully
                data:
                  _id: 650c1f1e2f8b9a001c2d3e4f
                  username: alex_rivera
                  email: alex.rivera@taskflow.dev
                  fullName: Alex Rivera
                  isEmailVerified: true
                  avatar:
                    url: https://placehold.co/200?text=No+Image
                    localPath: ""
                  createdAt: "2026-01-15T08:30:00.000Z"
                  updatedAt: "2026-01-15T08:30:00.000Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/resend-email-verification:
    post:
      tags:
        - Authentication
      summary: Resend email verification link
      description: >
        **Purpose**: Re-generates and sends a new email verification link to the authenticated user's email address.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: Updates verification token and expiration in database and sends email.<br>
        **Expected Behavior**: Returns HTTP 200. Throws HTTP 400 if user email is already verified.
      operationId: resendVerificationEmail
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Email verification link dispatched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Verification email sent successfully
                data: {}
        "400":
          description: User email is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                success: false
                message: Email is already verified
                errors: []
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change account password
      description: >
        **Purpose**: Updates the password for an active authenticated user account.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: Verifies old password, updates hashed password in MongoDB.<br>
        **Expected Behavior**: Returns HTTP 200. Throws HTTP 400 if old password is incorrect or new password validation fails.
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        "200":
          description: Password updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Password changed successfully
                data: {}
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /projects:
    get:
      tags:
        - Projects
      summary: List user projects
      description: >
        **Purpose**: Retrieves all projects where the authenticated user is a registered member, including total member count and current user role.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: None.<br>
        **Expected Behavior**: Returns HTTP 200 with array of project membership objects.
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number for paginated results
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Number of project items returned per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          example: 10
        - name: search
          in: query
          required: false
          description: Search term to filter projects by name or description
          schema:
            type: string
          example: FinTech Platform
        - name: sort
          in: query
          required: false
          description: Sorting field and direction (prefix `-` for descending)
          schema:
            type: string
            default: -createdAt
          example: -createdAt
      responses:
        "200":
          description: List of projects retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Projects fetched successfully!!!
                data:
                  - role: ADMIN
                    project:
                      _id: 650c1f1e2f8b9a001c2d3e4f
                      name: FinTech Platform Modernization
                      description: Upgrading microservices architecture and implementing OpenAPI documentation.
                      members: 4
                      createdBy: 650c1f1e2f8b9a001c2d3e4f
                      createdAt: "2026-01-10T10:00:00.000Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Projects
      summary: Create a new project
      description: >
        **Purpose**: Initializes a new project workspace.<br>
        **Authorization**: Required (`Bearer JWT`).<br>
        **Side Effects**: Creates Project document in MongoDB and creates ProjectMember document assigning creator as `ADMIN`.<br>
        **Expected Behavior**: Returns HTTP 201 with created Project object.
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        "201":
          description: Project created and administrator role assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 201
                success: true
                message: Project created successfully
                data:
                  _id: 650c1f1e2f8b9a001c2d3e4f
                  name: Mobile App Development
                  description: Developing native iOS and Android applications for task management workflow.
                  createdBy: 650c1f1e2f8b9a001c2d3e4f
                  createdAt: "2026-01-16T11:20:00.000Z"
                  updatedAt: "2026-01-16T11:20:00.000Z"
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}:
    get:
      tags:
        - Projects
      summary: Get project by ID
      description: >
        **Purpose**: Fetches detailed metadata for a specific project.<br>
        **Authorization**: Required (`Bearer JWT`). User must be a member (`ADMIN`, `PROJECT_ADMIN`, `MEMBER`).<br>
        **Side Effects**: None.<br>
        **Expected Behavior**: Returns HTTP 200 with Project object. Throws HTTP 403 if user is not a project member.
      operationId: getProjectById
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: 24-character hex MongoDB ObjectId of the target project
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
      responses:
        "200":
          description: Project details fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Project fetched successfully!!!
                data:
                  _id: 650c1f1e2f8b9a001c2d3e4f
                  name: FinTech Platform Modernization
                  description: Upgrading microservices architecture and implementing OpenAPI documentation.
                  createdBy: 650c1f1e2f8b9a001c2d3e4f
                  createdAt: "2026-01-10T10:00:00.000Z"
                  updatedAt: "2026-01-10T10:00:00.000Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Projects
      summary: Update project details
      description: >
        **Purpose**: Updates name or description of an existing project.<br>
        **Authorization**: Required (`Bearer JWT`). Role restricted to `ADMIN` only.<br>
        **Side Effects**: Updates Project document in MongoDB.<br>
        **Expected Behavior**: Returns HTTP 200 with updated Project details.
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: 24-character hex MongoDB ObjectId of the project
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        "200":
          description: Project updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Project details updated successfully!!!
                data:
                  _id: 650c1f1e2f8b9a001c2d3e4f
                  name: FinTech Platform & Mobile Modernization
                  description: Upgrading microservices architecture, implementing OpenAPI specs, and launching iOS app.
                  createdBy: 650c1f1e2f8b9a001c2d3e4f
                  createdAt: "2026-01-10T10:00:00.000Z"
                  updatedAt: "2026-01-16T14:00:00.000Z"
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Projects
      summary: Delete a project
      description: >
        **Purpose**: Permanently deletes a project workspace and all child entities.<br>
        **Authorization**: Required (`Bearer JWT`). Role restricted to `ADMIN` only.<br>
        **Side Effects**: Cascade deletes Project, ProjectMember, Task, SubTask, and Note records from MongoDB.<br>
        **Expected Behavior**: Returns HTTP 200 acknowledging project deletion.
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: 24-character hex MongoDB ObjectId of the project
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
      responses:
        "200":
          description: Project and associated resources cascade deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Project deleted successfully!!!
                data: null
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalServerError'

  /projects/{projectId}/members:
    get:
      tags:
        - Projects
      summary: Get project members
      description: >
        **Purpose**: Retrieves list of members and assigned roles in a project workspace.<br>
        **Authorization**: Required (`Bearer JWT`). User must be a member (`ADMIN`, `PROJECT_ADMIN`, `MEMBER`).<br>
        **Side Effects**: None.<br>
        **Expected Behavior**: Returns HTTP 200 with populated member list containing user details (username, email, avatar).
      operationId: getProjectMembers
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: 24-character hex MongoDB ObjectId of the project
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
      responses:
        "200":
          description: Project members list retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                statusCode: 200
                success: true
                message: Project members fetched successfully
                data:
                  - _id: 650c1f1e2f8b9a001c2d3e50
                    user:
                      _id: 650c1f1e2f8b9a001c2d3e4f
                      username: alex_rivera
                      email: alex.rivera@taskflow.dev
                      avatar:
                        url: https://placehold.co/200?text=No+Image
                    project: 650c1f1e2f8b9a001c2d3e4f
                    role: ADMIN
                  - _id: 650c1f1e2f8b9a001c2d3e51
                    user:
                      _id: 650c1f1e2f8b9a001c2d3e99
                      username: sam_dev
                      email: sam.dev@taskflow.dev
                      avatar:
                        url: https://placehold.co/200?text=No+Image
                    project: 650c1f1e2f8b9a001c2d3e4f
                    role: MEMBER
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
