components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter valid JWT Access Token obtained from `/api/v1/auth/login`.

  schemas:
    # --- Entity Schemas ---
    User:
      type: object
      required:
        - _id
        - username
        - email
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Unique MongoDB ObjectId for the user
        username:
          type: string
          minLength: 5
          maxLength: 40
          example: alex_rivera
          description: Unique user handle (lowercase, 5-40 characters)
        email:
          type: string
          format: email
          example: alex.rivera@taskflow.dev
          description: Registered email address
        fullName:
          type: string
          minLength: 5
          example: Alex Rivera
          description: Full name of the user
        avatar:
          type: object
          properties:
            url:
              type: string
              example: https://placehold.co/200?text=No+Image
              description: Avatar image URL
            localPath:
              type: string
              example: ""
              description: Local server file path if uploaded locally
        isEmailVerified:
          type: boolean
          default: false
          example: true
          description: Flag indicating if user email has been verified
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T08:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-15T08:30:00.000Z"

    Project:
      type: object
      required:
        - _id
        - name
        - description
        - createdBy
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Unique MongoDB ObjectId for the project
        name:
          type: string
          minLength: 5
          example: FinTech Platform Modernization
          description: Project title (minimum 5 characters)
        description:
          type: string
          minLength: 20
          example: Upgrading microservices architecture and implementing OpenAPI documentation.
          description: Detailed project description (minimum 20 characters)
        createdBy:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: MongoDB ObjectId of user who created the project
        createdAt:
          type: string
          format: date-time
          example: "2026-01-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-10T10:00:00.000Z"

    ProjectMember:
      type: object
      required:
        - _id
        - user
        - project
        - role
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e50
          description: Unique MongoDB ObjectId for the member relationship
        user:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: User ID of member
        project:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Project ID of workspace
        role:
          type: string
          enum: [ADMIN, PROJECT_ADMIN, MEMBER]
          default: MEMBER
          example: ADMIN
          description: Workspace access control role

    Task:
      type: object
      required:
        - _id
        - title
        - project
        - assignedTo
        - assignedBy
        - status
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e88
          description: Unique MongoDB ObjectId for the task
        title:
          type: string
          minLength: 5
          example: Perform Security Audit of JWT Authentication
          description: Task title (minimum 5 characters)
        description:
          type: string
          minLength: 20
          nullable: true
          example: Perform comprehensive security audit of JWT token issuance, verification middleware, and cookie storage settings.
          description: Detailed task description
        project:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Parent project ID
        assignedTo:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: User ID assigned to complete the task
        assignedBy:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: User ID who created/assigned the task
        status:
          type: string
          enum: [TODO, IN_PROGRESS, COMPLETED]
          default: TODO
          example: IN_PROGRESS
          description: Current lifecycle status of task
        attachments:
          type: array
          description: List of file attachment metadata objects
          items:
            type: object
            required:
              - url:
              - mimeType
              - size
            properties:
              url:
                type: string
                example: http://localhost:3000/images/security_audit_spec.pdf
              mimeType:
                type: string
                example: application/pdf
              size:
                type: integer
                example: 1048576
        createdAt:
          type: string
          format: date-time
          example: "2026-01-16T12:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-16T12:00:00.000Z"

    SubTask:
      type: object
      required:
        - _id
        - title
        - task
        - project
        - assignedBy
        - isCompleted
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e90
          description: Unique MongoDB ObjectId for the subtask
        title:
          type: string
          minLength: 5
          example: Check token expiration rules
          description: Subtask title (minimum 5 characters)
        task:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e88
          description: Parent task ID
        project:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Parent project ID
        assignedBy:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: User ID who created the subtask
        isCompleted:
          type: boolean
          default: false
          example: true
          description: Subtask completion flag

    Note:
      type: object
      required:
        - _id
        - content
        - project
        - createdBy
      properties:
        _id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e95
          description: Unique MongoDB ObjectId for the note
        content:
          type: string
          example: Keep OpenAPI schemas synchronized with Mongoose models during every release.
          description: Documentation note content
        project:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Parent project ID
        createdBy:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: User ID of note author
        createdAt:
          type: string
          format: date-time
          example: "2026-01-16T09:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-01-16T09:00:00.000Z"

    # --- Request Body Schemas ---
    RegisterUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 40
          example: alex_rivera
          description: Unique account handle (5-40 characters, lowercase)
        email:
          type: string
          format: email
          example: alex.rivera@taskflow.dev
          description: Valid primary email address
        password:
          type: string
          format: password
          minLength: 8
          example: SecretPass123!
          description: User account password (minimum 8 characters)

    LoginUserRequest:
      type: object
      required:
        - password
      properties:
        username:
          type: string
          minLength: 5
          example: alex_rivera
          description: Registered username (lowercase)
        email:
          type: string
          format: email
          example: alex.rivera@taskflow.dev
          description: Registered email address
        password:
          type: string
          format: password
          example: SecretPass123!
          description: Account password

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: alex.rivera@taskflow.dev
          description: Registered account email address

    ResetPasswordRequest:
      type: object
      required:
        - newPassword
        - confirmNewPassword
      properties:
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewSecurePass123!
          description: New password (minimum 8 characters)
        confirmNewPassword:
          type: string
          format: password
          example: NewSecurePass123!
          description: Confirmation matching new password

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
        - confirmNewPassword
      properties:
        oldPassword:
          type: string
          format: password
          example: SecretPass123!
          description: Current account password
        newPassword:
          type: string
          format: password
          minLength: 8
          example: NewSecurePass123!
          description: New password (minimum 8 characters)
        confirmNewPassword:
          type: string
          format: password
          example: NewSecurePass123!
          description: Confirmation matching new password

    CreateProjectRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 5
          example: FinTech Platform Modernization
          description: Project name (minimum 5 characters)
        description:
          type: string
          minLength: 20
          example: Upgrading microservices architecture and implementing OpenAPI documentation.
          description: Detailed project description (minimum 20 characters)

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 5
          example: FinTech Platform & Mobile Modernization
          description: Updated project name
        description:
          type: string
          minLength: 20
          example: Upgrading microservices architecture, implementing OpenAPI specs, and launching iOS app.
          description: Updated project description

    AddProjectMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          example: sam.dev@taskflow.dev
          description: Registered user email to invite
        role:
          type: string
          enum: [ADMIN, PROJECT_ADMIN, MEMBER]
          example: MEMBER
          description: Project permission role assigned to invited member

    UpdateMemberRoleRequest:
      type: object
      required:
        - newRole
      properties:
        newRole:
          type: string
          enum: [ADMIN, PROJECT_ADMIN, MEMBER]
          example: PROJECT_ADMIN
          description: Updated role permission for team member

    CreateTaskMultipartRequest:
      type: object
      required:
        - title
        - assignedTo
      properties:
        title:
          type: string
          minLength: 5
          example: Perform Security Audit of JWT Authentication
          description: Task title (minimum 5 characters)
        description:
          type: string
          minLength: 20
          nullable: true
          example: Perform comprehensive security audit of JWT token issuance, verification middleware, and cookie storage settings.
          description: Detailed task description (minimum 20 characters)
        assignedTo:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: MongoDB ObjectId of the project member assigned to task
        attachments:
          type: array
          description: Optional binary attachment files (up to 5 files)
          items:
            type: string
            format: binary

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          example: Perform Security Audit of JWT Authentication
          description: Updated title
        description:
          type: string
          minLength: 20
          example: Perform comprehensive security audit of JWT token issuance, verification middleware, and cookie storage settings.
          description: Updated description
        status:
          type: string
          enum: [TODO, IN_PROGRESS, COMPLETED]
          example: COMPLETED
          description: Updated task status
        assignedTo:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 650c1f1e2f8b9a001c2d3e4f
          description: Reassigned user ID

    CreateSubTaskRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 5
          example: Check token expiration rules
          description: Subtask title (minimum 5 characters)

    UpdateSubTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
          example: Check token expiration rules
          description: Updated subtask title
        isCompleted:
          type: boolean
          example: true
          description: Subtask completion status

    CreateNoteRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: Keep OpenAPI schemas synchronized with Mongoose models during every release.
          description: Documentation note content

    UpdateNoteRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          example: Updated documentation note content with revised architectural decisions.
          description: Updated note content

    # --- System Response Schemas ---
    ErrorResponse:
      type: object
      required:
        - statusCode
        - success
        - message
        - errors
      properties:
        statusCode:
          type: integer
          example: 400
          description: HTTP response status code
        success:
          type: boolean
          example: false
          description: Success flag (false for errors)
        message:
          type: string
          example: Request failed due to invalid input validation.
          description: Error message summary
        errors:
          type: array
          description: Array of detailed validation error objects or strings
          items:
            type: object
          example:
            - field: email
              message: Invalid email format
        stack:
          type: string
          nullable: true
          example: "Error: Bad Request at..."
          description: Stack trace snippet (only populated in development environment)

    SuccessResponse:
      type: object
      required:
        - statusCode
        - success
        - message
        - data
      properties:
        statusCode:
          type: integer
          example: 200
          description: HTTP response status code
        success:
          type: boolean
          example: true
          description: Success flag (true for successful responses)
        message:
          type: string
          example: Operation completed successfully
          description: Success message summary
        data:
          type: object
          nullable: true
          description: Response data payload

    Pagination:
      type: object
      required:
        - page
        - limit
        - totalDocs
        - totalPages
        - hasNextPage
        - hasPrevPage
      properties:
        page:
          type: integer
          example: 1
          description: Current page number
        limit:
          type: integer
          example: 10
          description: Items limit per page
        totalDocs:
          type: integer
          example: 45
          description: Total matching document count
        totalPages:
          type: integer
          example: 5
          description: Total pages count
        hasNextPage:
          type: boolean
          example: true
          description: True if subsequent page exists
        hasPrevPage:
          type: boolean
          example: false
          description: True if preceding page exists

  # --- Reusable HTTP System Responses ---
  responses:
    Unauthorized:
      description: Unauthorized - JWT Access Token is missing, invalid, or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            success: false
            message: Unauthorized request or invalid JWT token
            errors: []

    Forbidden:
      description: Forbidden - Insufficient role permissions to access this endpoint or project workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            success: false
            message: You do not have permission to perform this action
            errors: []

    NotFound:
      description: Not Found - The requested resource (user, project, task, subtask, note) does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 404
            success: false
            message: Resource not found
            errors: []

    Conflict:
      description: Conflict - Operation conflicts with existing state (e.g. duplicate username, email, or existing project member).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 409
            success: false
            message: User with this email or username already exists
            errors: []

    UnprocessableEntity:
      description: Unprocessable Entity - Request validation failed or parameters do not meet requirements.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 422
            success: false
            message: Validation failed for request fields
            errors:
              - field: confirmNewPassword
                message: Passwords do not match

    InternalServerError:
      description: Internal Server Error - An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            success: false
            message: Internal Server Error
            errors: []

    ValidationError:
      description: Validation Error - Input parameters or payload failed express-validator rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            success: false
            message: Validation Error
            errors:
              - field: email
                message: Invalid email format
