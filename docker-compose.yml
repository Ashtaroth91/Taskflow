services:
  mongodb:
    image: mongo:7.0
    container_name: taskflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-network

  backend:
    container_name: taskflow-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/taskflow
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173,http://localhost
      SERVER_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-taskflow_super_secret_access_token_jwt_key_2026}
      ACCESS_TOKEN_EXPIRY: ${ACCESS_TOKEN_EXPIRY:-30min}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-taskflow_super_secret_refresh_token_jwt_key_2026}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      MAILTRAP_SMTP_HOST: ${MAILTRAP_SMTP_HOST:-sandbox.smtp.mailtrap.io}
      MAILTRAP_SMTP_PORT: ${MAILTRAP_SMTP_PORT:-2525}
      MAILTRAP_SMTP_USERNAME: ${MAILTRAP_SMTP_USERNAME:-}
      MAILTRAP_SMTP_PASSWORD: ${MAILTRAP_SMTP_PASSWORD:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/v1/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskflow-network

  frontend:
    container_name: taskflow-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: TaskFlow
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - taskflow-network

volumes:
  mongo_data:
    driver: local

networks:
  taskflow-network:
    driver: bridge

