name: TaskFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run automated API tests
        working-directory: backend
        env:
          PORT: 8000
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/taskflow_test
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_key_12345
          ACCESS_TOKEN_EXPIRY: 30min
          REFRESH_TOKEN_SECRET: ci_test_refresh_token_secret_key_12345
          REFRESH_TOKEN_EXPIRY: 7d
        run: npm test

  frontend-ci:
    name: Frontend Build & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_NAME: TaskFlow
        run: npm run build

  docker-ci:
    name: Docker Build & Stack Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

      - name: Start stack in detached mode
        env:
          ACCESS_TOKEN_SECRET: ci_test_access_token_secret_key_12345
          REFRESH_TOKEN_SECRET: ci_test_refresh_token_secret_key_12345
        run: docker compose up -d

      - name: Wait for services and verify health
        run: |
          echo "Waiting for services to become healthy..."
          timeout=90
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -s -f http://localhost:8000/api/v1/healthcheck > /dev/null; then
              echo "Backend health check succeeded!"
              exit 0
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          echo "Health check timed out. Showing service logs:"
          docker compose logs
          exit 1

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v

